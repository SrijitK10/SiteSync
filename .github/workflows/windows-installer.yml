name: Build Windows Installer & Release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as GitHub Release'
        required: false
        type: boolean
        default: false
      custom_tag:
        description: 'Custom Release Tag (e.g. v1.0.0)'
        required: false
        type: string
  push:
    branches:
      - master
    paths:
      - app/**
      - .github/workflows/windows-installer.yml

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop support
        run: flutter config --enable-windows-desktop

      - name: Extract App Version from pubspec.yaml
        id: get_version
        shell: pwsh
        run: |
          $pubspec = Get-Content pubspec.yaml -Raw
          if ($pubspec -match 'version:\s*([0-9]+\.[0-9]+\.[0-9]+)(\+([0-9]+))?') {
            $ver = $matches[1]
            $buildNum = if ($matches[3]) { $matches[3] } else { "1" }
            Write-Host "Detected app version: $ver+$buildNum"
            "APP_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
            "BUILD_NUMBER=$buildNum" | Out-File -FilePath $env:GITHUB_ENV -Append
            "VERSION_TAG=v$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            Write-Host "Fallback to default version 1.0.0"
            "APP_VERSION=1.0.0" | Out-File -FilePath $env:GITHUB_ENV -Append
            "BUILD_NUMBER=1" | Out-File -FilePath $env:GITHUB_ENV -Append
            "VERSION_TAG=v1.0.0" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Windows release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "build/windows/x64" | Out-Null
          Set-Content -Path "build/windows/x64/CMakeCache.txt" -Value "CMAKE_POLICY_VERSION_MINIMUM:STRING=3.5`r`n"
          flutter build windows --release --build-name=$env:APP_VERSION --build-number=$env:BUILD_NUMBER

      - name: Verify Windows release output
        shell: pwsh
        run: |
          $exePath = "build/windows/x64/runner/Release/rupayan.exe"
          if (!(Test-Path $exePath)) {
            throw "Expected $exePath to exist after flutter build windows --release"
          }
          Write-Host "Verified Windows executable at $exePath"

      - name: Package Portable Windows ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "build/windows-installer" | Out-Null
          $zipPath = "build/windows-installer/RupayanSiteSync-Windows-Portable-v$env:APP_VERSION.zip"
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath $zipPath -Force
          Write-Host "Created portable archive: $zipPath"

      - name: Ensure Inno Setup is available
        shell: pwsh
        run: |
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue)?.Source
          if (-not $iscc) {
            $candidates = @(
              "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
              "C:\Program Files\Inno Setup 6\ISCC.exe"
            )
            foreach ($path in $candidates) {
              if (Test-Path $path) {
                $iscc = $path
                break
              }
            }
          }
          if (-not $iscc) {
            Write-Host "Inno Setup not detected, installing via Chocolatey..."
            choco install innosetup --no-progress -y
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            if (!(Test-Path $iscc)) {
              $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe"
            }
          }
          Write-Host "Using Inno Setup compiler: $iscc"
          "ISCC_PATH=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $iscc = $env:ISCC_PATH
          & $iscc "/DMyAppVersion=$env:APP_VERSION" "windows\packaging\rupayan_sitesync_installer.iss"

      - name: Verify installer output
        shell: pwsh
        run: |
          $setupPath = "build/windows-installer/RupayanSetup.exe"
          if (!(Test-Path $setupPath)) {
            throw "Expected $setupPath to exist after Inno Setup packaging"
          }
          $versionedSetup = "build/windows-installer/RupayanSiteSyncSetup-v$env:APP_VERSION.exe"
          Copy-Item $setupPath $versionedSetup -Force
          Write-Host "Verified installer at $setupPath and created $versionedSetup"

      - name: Generate Checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path "build/windows-installer" -Include *.exe, *.zip -Recurse
          $hashes = foreach ($file in $files) {
            $hash = (Get-FileHash -Path $file.FullName -Algorithm SHA256).Hash
            "$hash  $($file.Name)"
          }
          $hashes | Out-File -FilePath "build/windows-installer/checksums-sha256.txt" -Encoding ascii
          Get-Content "build/windows-installer/checksums-sha256.txt"

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: rupayan-windows-installer
          path: |
            app/build/windows-installer/RupayanSetup.exe
            app/build/windows-installer/RupayanSiteSyncSetup-v*.exe

      - name: Upload Windows portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: rupayan-windows-portable
          path: app/build/windows-installer/RupayanSiteSync-Windows-Portable-v*.zip

      - name: Upload Checksums artifact
        uses: actions/upload-artifact@v4
        with:
          name: rupayan-windows-checksums
          path: app/build/windows-installer/checksums-sha256.txt

      - name: Upload raw Windows release folder
        uses: actions/upload-artifact@v4
        with:
          name: rupayan-windows-release
          path: app/build/windows/x64/runner/Release/

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.custom_tag || env.VERSION_TAG }}
          name: Rupayan SiteSync ${{ env.APP_VERSION }}
          draft: false
          prerelease: false
          files: |
            app/build/windows-installer/RupayanSetup.exe
            app/build/windows-installer/RupayanSiteSyncSetup-v*.exe
            app/build/windows-installer/RupayanSiteSync-Windows-Portable-v*.zip
            app/build/windows-installer/checksums-sha256.txt
